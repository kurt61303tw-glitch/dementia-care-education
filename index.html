<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日失智衛教一句話｜50則高實證護腦知識橫幅</title>
  <style>
    :root {
      --bg-page: #F7F6F3;
      --banner-bg: #FFFFFF;
      --strip-bg: #FAF9F5;
      --border: #E6E4DD;
      --primary: #1F6E6C;
      --primary-light: #E6F3F2;
      --accent: #D96B27;
      --accent-light: #FFF3E6;
      --text-main: #2C2B28;
      --text-muted: #73706A;
      --mask-bg: #E5E3DC;
      --mask-hover: #D8D5CC;
      --reveal-bg: #F0FAF4;
      --reveal-border: #86EFAC;
      --reveal-text: #14532D;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    }

    body {
      background: transparent;
      color: var(--text-main);
      padding: 12px 16px;
      line-height: 1.5;
    }

    /* 橫式 Notion 嵌入式主容器（寬扁型、一眼看完） */
    .horizontal-banner {
      max-width: 980px;
      margin: 0 auto;
      background: var(--banner-bg);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }

    /* 頂部薄控制條：編號、分類、50題快速選單、證據來源標籤 */
    .top-strip {
      background: var(--strip-bg);
      border-bottom: 1px solid var(--border);
      padding: 8px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .strip-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pulse-dot {
      width: 9px;
      height: 9px;
      background: #16A34A;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.18);
    }

    .badge-day {
      font-size: 0.86rem;
      font-weight: 800;
      color: var(--primary);
      background: var(--primary-light);
      padding: 2px 10px;
      border-radius: 6px;
    }

    .badge-cat {
      font-size: 0.85rem;
      font-weight: 700;
      color: #9A420A;
      background: var(--accent-light);
      padding: 2px 10px;
      border-radius: 6px;
    }

    .badge-source {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      background: #EFECE6;
      padding: 2px 9px;
      border-radius: 6px;
    }

    .strip-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .topic-select {
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.84rem;
      font-weight: 600;
      max-width: 240px;
      cursor: pointer;
    }

    .mini-btn {
      background: #FFFFFF;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mini-btn:hover {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }

    /* 中央核心橫式主體：左邊「題目＋思考提示」，右邊「每日衛教一句話遮蔽答案」 */
    .banner-main-row {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 18px;
      padding: 16px 20px;
      align-items: center;
    }

    .question-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 8px;
      border-right: 1.5px dashed var(--border);
    }

    .question-text {
      font-size: 1.18rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.45;
    }

    .hint-line {
      font-size: 0.92rem;
      color: #8C5828;
      background: #FFFDF8;
      border-left: 3.5px solid var(--accent);
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: 600;
    }

    /* 右欄：遮蔽式「每日衛教一句話」答案盒 */
    .answer-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .spoiler-one-liner {
      position: relative;
      border-radius: 12px;
      padding: 16px 18px;
      cursor: pointer;
      transition: all 0.22s ease;
      user-select: none;
      min-height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--border);
      background: #FAF9F5;
    }

    .spoiler-one-liner.masked .one-liner-text {
      color: transparent;
      text-shadow: 0 0 10px rgba(44, 43, 40, 0.45);
      filter: blur(4px);
    }

    .spoiler-one-liner.masked {
      background: var(--mask-bg);
    }

    .spoiler-one-liner.masked:hover {
      background: var(--mask-hover);
      border-color: #C5C1B6;
    }

    .mask-prompt-overlay {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.98rem;
      font-weight: 800;
      color: #3F3D39;
      background: rgba(232, 230, 223, 0.76);
      border-radius: 10px;
      pointer-events: none;
    }

    .spoiler-one-liner.masked .mask-prompt-overlay {
      display: flex;
    }

    .spoiler-one-liner.revealed {
      background: var(--reveal-bg);
      border-color: var(--reveal-border);
      user-select: text;
    }

    .one-liner-text {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--reveal-text);
      line-height: 1.5;
    }

    /* 翻開後的「我猜對了／學到了」迷你互動確認列 */
    .feedback-mini-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.84rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 6px;
    }

    .check-pill-btn {
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--text-main);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .check-pill-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .check-pill-btn.active {
      background: #16A34A;
      color: #FFFFFF;
      border-color: #16A34A;
    }

    @media (max-width: 720px) {
      .banner-main-row {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .question-col {
        border-right: none;
        border-bottom: 1.5px dashed var(--border);
        padding-right: 0;
        padding-bottom: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- 橫式 Notion 嵌入式「每日失智衛教一句話」橫幅 -->
  <div class="horizontal-banner" id="bannerApp"></div>

    /*************************************************************************
     * 依照真實日曆算出今天是第幾題（每天自動輪替 1 ~ 50 題）
     *************************************************************************/
    function getTodayTopicIndex() {
      const now = new Date();
      const start = new Date(now.getFullYear(), 0, 0);
      const dayOfYear = Math.floor((now - start) / (1000 * 60 * 60 * 24));
      return dayOfYear % EVIDENCE_TOPICS_50.length;
    }

    let state = {
      currentIdx: getTodayTopicIndex(),
      isMasked: true,      // true = 灰色遮蔽中，點一下變 false 揭曉答案
      userSelfCheck: null  // 'bingo' | 'learned' | null
    };

    function renderBanner() {
      const item = EVIDENCE_TOPICS_50[state.currentIdx];
      const todayIdx = getTodayTopicIndex();
      const isToday = (state.currentIdx === todayIdx);

      // 建立 50 題快速下拉選單
      const optionsHtml = EVIDENCE_TOPICS_50.map((t, idx) => {
        const todayMark = (idx === todayIdx) ? '【今日】' : '';
        return `<option value="${idx}" ${idx === state.currentIdx ? 'selected' : ''}>
          #${t.id} ${todayMark}${t.cat}
        </option>`;
      }).join('');

      const app = document.getElementById('bannerApp');
      app.innerHTML = `
        <!-- 1. 頂部橫式資訊條 -->
        <div class="top-strip">
          <div class="strip-left">
            <span class="pulse-dot"></span>
            <span class="badge-day">📅 每日衛教 #${item.id} / 50 ${isToday ? '（今日焦點）' : ''}</span>
            <span class="badge-cat">📌 ${item.cat}</span>
            <span class="badge-source">🔬 ${item.source}</span>
          </div>

          <div class="strip-right">
            <button class="mini-btn" onclick="switchTopic(-1)" title="上一題">◀</button>
            <select class="topic-select" onchange="jumpTopic(this.value)" aria-label="選擇50則失智衛教主題">
              ${optionsHtml}
            </select>
            <button class="mini-btn" onclick="switchTopic(1)" title="下一題">▶</button>
            <button class="mini-btn" onclick="randomTopic()" title="隨機抽一題">🎲 隨機抽</button>
          </div>
        </div>

        <!-- 2. 橫式主體：左欄「問題＋思考提示語」，右欄「遮蔽式每日衛教一句話」 -->
        <div class="banner-main-row">
          <!-- 左欄：題目與給初學者／工作者的提示語 -->
          <div class="question-col">
            <div class="question-text">
              💡 ${item.q}
            </div>
            <div class="hint-line">
              ${item.hint}（先在心裡想一下答案，再點右邊揭曉！）
            </div>
          </div>

          <!-- 右欄：點一下撥開的「每日衛教一句話」遮蔽答案 -->
          <div class="answer-col">
            <div class="spoiler-one-liner ${state.isMasked ? 'masked' : 'revealed'}"
                 onclick="toggleSpoiler()"
                 title="點一下切換顯示或遮蔽答案">
              <div class="one-liner-text">${item.a}</div>
              <div class="mask-prompt-overlay">
                <span>🔒</span>
                <span>想好了嗎？點一下揭曉「每日衛教一句話」答案</span>
              </div>
            </div>

            <div class="feedback-mini-row">
              <span>${state.isMasked ? '👆 點擊上方灰色遮罩看科學解答' : '🙌 你的答案跟科學實證一樣嗎？'}</span>
              <div>
                <button class="check-pill-btn ${state.userSelfCheck === 'bingo' ? 'active' : ''}"
                        onclick="markCheck('bingo')">
                  🎉 我有答對！
                </button>
                <button class="check-pill-btn ${state.userSelfCheck === 'learned' ? 'active' : ''}"
                        onclick="markCheck('learned')">
                  💡 學到一招（跳下一題 ▶）
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function toggleSpoiler() {
      state.isMasked = !state.isMasked;
      renderBanner();
    }

    function markCheck(type) {
      state.userSelfCheck = type;
      state.isMasked = false;
      renderBanner();
      if (type === 'learned') {
        setTimeout(() => switchTopic(1), 450);
      }
    }

    function switchTopic(offset) {
      const len = EVIDENCE_TOPICS_50.length;
      state.currentIdx = (state.currentIdx + offset + len) % len;
      state.isMasked = true;
      state.userSelfCheck = null;
      renderBanner();
    }

    function jumpTopic(val) {
      state.currentIdx = parseInt(val, 10);
      state.isMasked = true;
      state.userSelfCheck = null;
      renderBanner();
    }

    function randomTopic() {
      let next = Math.floor(Math.random() * EVIDENCE_TOPICS_50.length);
      if (next === state.currentIdx) next = (next + 1) % EVIDENCE_TOPICS_50.length;
      state.currentIdx = next;
      state.isMasked = true;
      state.userSelfCheck = null;
      renderBanner();
    }

    // 初始化
    renderBanner();
  </script>
